name: Publish portfolio website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/publish-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website files
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
