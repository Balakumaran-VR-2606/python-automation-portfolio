name: Build Daymark apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/daymark/**"
      - ".github/workflows/build-daymark.yml"

permissions:
  contents: read
  actions: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: native/daymark/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-Android-APK
          path: native/daymark/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        run: python -m pip install --upgrade pyinstaller pystray pillow
      - name: Package windowed app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Daymark native/daymark/windows/daymark.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-Windows-EXE
          path: dist/Daymark.exe
          if-no-files-found: error
